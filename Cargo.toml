[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.26.0"
futures = "0.3"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Perfil de desarrollo ligero en disco: solo tablas de líneas (los backtraces y errores
# siguen mostrando archivo:línea) para nuestro código, y sin info de depuración para
# dependencias. Reduce `target/debug` drásticamente (antes ~100 GB con muchos ejemplos).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Los tests compilan con el perfil dev; mismo criterio.
[profile.test]
debug = "line-tables-only"

# Fork local de gpui 0.2.2 con el parche de rendimiento de Selachi (bench/patches/gpui-selachi.patch):
# reloj de frames bajo demanda (0% CPU en reposo) y texturas de paths perezosas (-47 MB).
# Quitar cuando upstream lo corrija.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

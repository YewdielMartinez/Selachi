# Selachi agents_svc pricing table.  USD per 1,000,000 tokens (Mtok).
# Every figure is an ESTIMATE derived from public list prices; unknown models yield no cost (never guessed).
# Users may override this file (see PricingTable::load).  Fields:
#   id             model id as written in the agent logs (matched case-insensitively, after dropping a
#                  trailing "[1m]"-style suffix and a "-YYYYMMDD" date suffix)
#   agent          "claude" | "codex" (optional, restricts the match)
#   input/output   $/Mtok. For Codex, "input" is applied to NON-cached input tokens only.
#   cache_write    $/Mtok for 5-minute cache writes (Anthropic); omit if the provider has no such price
#   cache_write_1h $/Mtok for 1-hour cache writes (Claude Code uses 1h writes); falls back to cache_write
#   cache_read     $/Mtok for cache reads / cached input; omit when unknown -> cost is None if used
# A cost is None whenever a token class with a non-zero count has no price.
# Not modelled: long-context surcharge tiers (e.g. OpenAI >272K input), batch/priority/fast tiers.

version = "2026-11-20"

# ---- Claude (Anthropic list prices; cache write = 1.25x input (5m) / 2x input (1h)) ----
[[model]]
id = "claude-opus-5-5"
agent = "claude"
input = 4.0
output = 20.0
cache_write = 5.0
cache_write_1h = 8.0
cache_read = 0.20
source = "Anthropic list price; cross-checked exactly against Claude Code cost-state totals (38 sessions)"


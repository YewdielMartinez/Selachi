[package]
name = "ui_settings"
version = "0.1.0"
edition = "2024"
description = "Selachi settings view (Odla-style: section list + content) and the grammar plugin manager (HTTPS index, sha256-pinned archives)"

[lints]
workspace = true

[features]
# Lets `LocalFetcher` serve the plugin index from a `file://` URL and map archive URLs onto a
# local folder. For debug examples and tests only: never enable it in a release build.
dev-file-urls = []

[dependencies]
gpui.workspace = true
futures.workspace = true
agents_driver = { version = "0.1.0", path = "../agents_driver" }
panel_api = { version = "0.1.0", path = "../panel_api" }
store = { version = "0.0.1", path = "../store" }
theme = { version = "0.1.0", path = "../theme" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }
viewer_svc = { version = "0.1.0", path = "../viewer_svc" }
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[example]]
name = "settings_demo"
required-features = ["dev-file-urls"]

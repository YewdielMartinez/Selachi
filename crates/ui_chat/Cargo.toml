[package]
name = "ui_chat"
version = "0.1.0"
edition = "2024"
description = "Selachi chat mode UI (wave 5.6): thread list (sidebar section or panel), chat tab with virtualized conversation, composer, approvals, plan bar and the new-thread screen. Pure view of chat_core; emits ChatEvent for the chat-terminal bridge"

[lints]
workspace = true

[dependencies]
agents_driver = { version = "0.1.0", path = "../agents_driver" }
chat_core = { version = "0.1.0", path = "../chat_core" }
futures.workspace = true
gpui.workspace = true
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
log.workspace = true
panel_api = { version = "0.1.0", path = "../panel_api" }
serde_json = "1"
store = { version = "0.0.1", path = "../store" }
theme = { version = "0.1.0", path = "../theme" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }
viewer_svc = { version = "0.1.0", path = "../viewer_svc" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[dev-dependencies]
agents_svc = { path = "../agents_svc" }
gpui = { workspace = true, features = ["test-support"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
ui_kit = { version = "0.1.0", path = "../ui_kit", features = ["test-support"] }

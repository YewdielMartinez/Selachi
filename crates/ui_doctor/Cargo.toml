[package]
name = "ui_doctor"
version = "0.1.0"
edition = "2024"
description = "Selachi doctor panel (backlog A14): own RAM / CPU / threads, child processes, frame times, sessions and DB sizes with dither sparklines and a copyable markdown diagnosis"

[lints]
workspace = true

[dependencies]
gpui.workspace = true
panel_api = { version = "0.1.0", path = "../panel_api" }
proc_svc = { version = "0.0.1", path = "../proc_svc" }
theme = { version = "0.1.0", path = "../theme" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

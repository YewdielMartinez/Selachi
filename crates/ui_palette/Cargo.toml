[package]
name = "ui_palette"
version = "0.1.0"
edition = "2024"
description = "Selachi command palette (A1, Ctrl+K): fuzzy search over actions, tabs, projects, history, tasks, snippets, git and layout presets. Emits PaletteEvent; the host executes"

[lints]
workspace = true

[dependencies]
gpui.workspace = true
git_svc = { version = "0.1.0", path = "../git_svc" }
panel_api = { version = "0.1.0", path = "../panel_api" }
store = { version = "0.0.1", path = "../store" }
tasks_svc = { version = "0.0.1", path = "../tasks_svc" }
theme = { version = "0.1.0", path = "../theme" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }

[dev-dependencies]
tempfile = "3"
ui_kit = { version = "0.1.0", path = "../ui_kit", features = ["test-support"] }

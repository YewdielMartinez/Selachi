# Selachi configuration
# ---------------------------------------------------------------------------
# Edit by hand; changes are picked up while Selachi is running. If the file
# has a mistake, Selachi keeps the last good configuration and shows the error.
# Delete any line to go back to its default. Unknown keys are kept as they are.

[general]
# Idioma de la interfaz. Por ahora solo existe "es" (español).
language = "es"
# Pedir confirmación al cerrar una pestaña o la ventana mientras corre un comando.
confirm_close_running = true

[appearance]
# "dark" | "light" | "oled" | "system"
mode = "dark"
# Brand accent, #RRGGBB. Only used for active states, progress and confirmation.
accent = "#00AAFF"
ui_font = "DM Sans"
mono_font = "Geist Mono"
# Terminal font size in points, and line height as a multiplier.
mono_size = 13.0
line_height = 1.3

[appearance.translucency]
# 0.0 (transparent) .. 1.0 (opaque)
sidebar = 1.0
main = 1.0
# Blur what is behind translucent areas (Windows acrylic).
blur = false

[terminal]
# Name of a profile (see [[profiles]] below). Empty = auto-detect (pwsh > powershell > cmd).
default_profile = ""
# Lines of scrollback kept in memory. Scrollback is never written to disk.
scrollback = 10000
# "block" | "bar" | "underline"
cursor_style = "block"
copy_on_select = false
# Ctrl+V pastes instead of sending ^V to the running program.
paste_ctrl_v = true

[terminal.completion]
# Autocompletado de PowerShell (PSReadLine). Selachi lo aplica al abrir el shell sin tocar tu perfil.
# Tecla Tab:
#   "smart"    acepta la sugerencia gris si la hay; si no, abre el menu de completado (por defecto)
#   "complete" recorre las opciones una a una (TabCompleteNext)
#   "menu"     siempre abre el menu de completado (MenuComplete)
#   "native"   no toca tu configuracion de Tab
tab = "smart"
# Origen de las sugerencias grises:
# "history" (por defecto) | "history_and_plugin" | "off" | "native" (no tocar)
prediction = "history"
# Como se dibujan: "inline" (texto gris tras el cursor) | "list" (lista bajo el prompt) | "native"
prediction_view = "inline"
# Tecla que acepta la siguiente palabra de la sugerencia ("native" = no tocar la tecla).
accept_word_key = "Ctrl+RightArrow"

[agents]
# Day the weekly usage window starts: "monday" .. "sunday"
usage_week_start = "monday"
# Show estimated cost (from the local pricing table) next to token counts.
show_estimates = true
# Starting permission mode for new agent threads:
# "ask" | "accept_edits" | "read_only" | "full"
permission_default = "ask"
# Install the Claude Code statusline hook to read exact context and cost.
claude_statusline_hook = false
# Experimental: consultar el endpoint OAuth de uso de Anthropic para ver los límites exactos
# (5 h y semanal). Apagado por defecto: Selachi no hace llamadas de red a tu cuenta si no lo activas.
oauth_usage_endpoint = false

[git]
# Ask before force-push, hard reset, branch delete and similar actions.
confirm_sensitive = true
# Comando para abrir un archivo en tu editor, p. ej. "code -g". Vacío = el editor del sistema.
external_editor = ""
# Dónde se crean los worktrees nuevos:
#   "beside"  junto a la carpeta del repositorio (por defecto)
#   "inside"  dentro del repositorio, en .worktrees
#   o una ruta: una carpeta única para todos, p. ej. "D:\worktrees"
worktrees = "beside"

[plugins]
# URL (https://) del índice grammars.toml de los plugins de lenguaje. Vacío = el índice oficial
# (https://github.com/YewdielMartinez/Selachi/releases/latest/download/grammars.toml).
# Solo se descarga al abrir Ajustes > Plugins.
index_url = ""

[session]
# Restaurar la sesión al abrir Selachi: pestañas, paneles divididos y la carpeta de cada
# terminal. Los shells arrancan al mostrar cada pestaña. Nunca se guarda lo que imprimió la
# terminal (ni el scrollback ni las variables de entorno).
restore = true

[processes]
# What to do with processes started by a thread when the thread is closed:
# "ask" | "always" | "never"
auto_stop_on_thread_close = "ask"

[retention]
# Command history older than this is deleted (0 = keep forever).
history_days = 90
# Raw agent usage events older than this are deleted (daily totals are kept).
usage_raw_days = 30
# Hard cap on stored commands (0 = no cap).
history_max_rows = 500000

[delegation]
# Delegar en otros agentes (`selachi agent run ...` / MCP `selachi`). Ajustes > Agentes > Delegación.
enabled = true
# Agentes permitidos: "claude", "codex", "opencode", "gemini", "agy". Vacío = todos.
allowed_agents = []
# Permiso máximo de una delegación: "read_only" | "ask" | "accept_edits". `full` nunca se delega.
max_permission = "accept_edits"
# Ejecuciones a la vez (1-16).
max_concurrent = 3
# Cadena máxima: 1 = el padre delega y el hijo no puede volver a delegar.
max_depth = 1
# Tiempo máximo por ejecución, en segundos.
timeout_secs = 900
# Tokens facturables por día entre todas las delegaciones (0 = sin límite).
daily_token_budget = 2000000
# Rechaza delegar en un agente cuyo límite semanal supere este % (0 = nunca rechaza).
weekly_usage_threshold_percent = 90.0
# Segundos que se espera tu respuesta a una aprobación antes de denegarla.
approval_timeout_secs = 120

[updates]
# Buscar actualizaciones (a los 30 s de arrancar y luego cada 24 h, solo por HTTPS contra
# GitHub Releases). false = no se toca la red.
check = true
# Canal: "stable".
channel = "stable"
# Cuándo se instala una actualización descargada: "now" (al pulsar "Reiniciar y actualizar")
# o "on_exit" (en silencio al cerrar Selachi).
install = "now"

[layout]
# Organización visual de Selachi (también se cambia en vivo desde el panel de
# layout, Ctrl+Shift+L, o en Ajustes > Diseño). Preset de partida, uno de:
#   "espacios_unificados"  sidebar de cristal con los espacios (proyectos y worktrees) y sus
#                  pestañas anidadas, acciones arriba, medidor de uso abajo; sin rail ni pestañas
#                  arriba; los botones de paneles van a la derecha de la barra de título.
#                  Es el preset de las instalaciones nuevas (las existentes conservan el suyo).
#   "terminal"     rail + pestañas arriba + terminal; sin sidebar (por defecto si falta la clave)
#   "espacios"     sidebar con espacios, proyectos y agentes; pestañas arriba; 2 splits
#   "orquestador"  proyecto > worktree > agentes con pestañas verticales; 3 paneles; barra completa
#   "chat"         hilos agrupados por estado a la izquierda y panel de contexto a la derecha
#   "zen"          solo la terminal; el resto aparece al pasar el ratón por el borde
# o el nombre de uno de tus presets propios (ver [[layout.custom_presets]] más abajo).
preset = "espacios_unificados"

# Ajustes finos sobre el preset. Todo es opcional: descomenta solo lo que quieras
# cambiar. Cambiar de preset desde el panel borra estos ajustes. Las combinaciones
# imposibles se corrigen solas y Selachi muestra un aviso (nunca falla).
[layout.overrides]
# Dónde van las pestañas: "top" (arriba) | "sidebar" (verticales, exige sidebar) | "hidden"
# tabs_position = "top"
# Rail de iconos: "visible" | "hidden" (ocultarlo exige una sidebar visible)
# rail = "visible"
# Panel derecho: "git" | "context" | "procs" | "viewer" | "none" (u otro id registrado)
# right_panel = "none"
# Barra inferior: "compact" (píldoras) | "full" (medidores por agente) | "hidden"
# bottom_bar = "compact"
# Divisiones del área principal: "single" | "two_vertical" | "two_horizontal"
#   | "one_and_two_stacked" (1 + 2 apiladas, como Orca) | "grid2x2"
# splits = "single"
# Densidad: "compact" | "comfortable"
# density = "comfortable"
# Translucidez de la sidebar (Mica/Acrylic de Windows): 0 (opaca) .. 100
# sidebar_translucency = 0
# Breadcrumb (proyecto > rama) en la barra de título.
# breadcrumb = false
# Reducir movimiento: los cambios de layout son instantáneos, sin animación.
# reduced_motion = false
# Modo zen: sin sidebar, rail ni barra inferior; las pestañas aparecen al pasar el ratón.
# zen = false
#
# Sidebar. Descomenta también el encabezado de abajo si usas alguna de estas claves.
# [layout.overrides.sidebar]
# Lado: "left" | "right" | "hidden"
# side = "left"
# Ancho en píxeles (se limita a 180..480). También se arrastra con el ratón.
# width_px = 240
# Secciones, en orden; la que no aparece está desactivada:
# "projects" | "worktrees" | "agents" | "threads" | "spaces"
# sections = ["projects", "agents"]
# Agrupar pestañas e hilos por: "project" | "status" | "agent" | "none"
# group_by = "none"
# Sidebar unificada (preset "espacios_unificados"):
# Acciones "Nueva pestaña" y "Buscar" arriba.
# show_actions = true
# Fila de iconos pequeños, uno por panel registrado.
# panel_icons = true
# Las pestañas son filas anidadas dentro de su espacio (proyecto / worktree).
# nested_tabs = true
# Medidor de uso compacto y botón de Ajustes al pie.
# footer_usage = true
# Cada fila muestra el modelo (y la rama) y el tiempo transcurrido.
# row_model = true
# row_time = true
#
# Botones de la derecha de la barra de título, en orden. Ids de panel ("git", "files",
# "procs", "usage", "attention"...) más "review" (abre la pestaña de revisión) y "layout"
# (el panel de layout). Descomenta también el encabezado de abajo.
# [layout.overrides.titlebar]
# panel_buttons = ["git", "files", "procs", "usage", "review", "attention", "layout"]

# Un layout distinto para un proyecto: se aplica a todo directorio dentro de "path"
# (sin distinguir mayúsculas; gana la ruta más específica). Mismas claves que
# [layout.overrides]. Ejemplo:
#
# [[layout.project_overrides]]
# path = "C:\\Users\\me\\code\\app"
# [layout.project_overrides.overrides]
# density = "compact"
# right_panel = "git"

# Presets propios: un nombre y un layout completo (las claves que falten toman el
# valor del preset "terminal"). Se eligen con preset = "<name>" y el panel de layout
# puede guardarlos por ti. Ejemplo:
#
# [[layout.custom_presets]]
# name = "Revisión"
# tabs_position = "top"
# rail = "visible"
# right_panel = "git"
# bottom_bar = "compact"
# splits = "two_vertical"
# density = "compact"
# sidebar_translucency = 0
# breadcrumb = true
# reduced_motion = false
# zen = false
# [layout.custom_presets.sidebar]
# side = "left"
# width_px = 260
# sections = ["projects", "worktrees"]
# group_by = "project"
# show_actions = false
# panel_icons = false
# nested_tabs = false
# footer_usage = false
# row_model = true
# row_time = true
# [layout.custom_presets.titlebar]
# panel_buttons = ["layout"]

# Extra shell profiles. Example:
#
# [[profiles]]
# name = "Dev"
# program = "pwsh.exe"
# args = ["-NoLogo"]
# cwd = "C:\\Users\\me\\code"
# [profiles.env]
# RUST_LOG = "info"

# Keybinding overrides: action = "chord". Only list what you want to change.
# Example:
#   "terminal.new_tab" = "ctrl+shift+t"
[keybindings]

[package]
name = "selachi"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
agent_harness = { version = "0.1.0", path = "../agent_harness" }
agents_driver = { version = "0.1.0", path = "../agents_driver" }
agents_svc = { version = "0.0.1", path = "../agents_svc" }
anyhow.workspace = true
chat_core = { version = "0.1.0", path = "../chat_core" }
env_logger.workspace = true
futures.workspace = true
git_svc = { version = "0.1.0", path = "../git_svc" }
gpui.workspace = true
log.workspace = true
panel_api = { version = "0.1.0", path = "../panel_api" }
proc_svc = { path = "../proc_svc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
store = { version = "0.0.1", path = "../store" }
term_core = { version = "0.1.0", path = "../term_core", features = ["block-events"] }
theme = { version = "0.1.0", path = "../theme" }
toml = "0.8"
ui_agentmap = { version = "0.1.0", path = "../ui_agentmap" }
ui_chat = { version = "0.1.0", path = "../ui_chat" }
ui_doctor = { path = "../ui_doctor" }
ui_git = { path = "../ui_git" }
ui_layout = { version = "0.1.0", path = "../ui_layout" }
ui_onboarding = { path = "../ui_onboarding" }
ui_palette = { version = "0.1.0", path = "../ui_palette" }
ui_procs = { path = "../ui_procs" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }
ui_review = { path = "../ui_review" }
ui_settings = { path = "../ui_settings" }
ui_usage = { path = "../ui_usage" }
ui_viewer = { path = "../ui_viewer" }
updater = { version = "0.1.0", path = "../updater" }
viewer_svc = { version = "0.1.0", path = "../viewer_svc" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
gpui = { workspace = true, features = ["test-support"] }
ui_kit = { version = "0.1.0", path = "../ui_kit", features = ["test-support"] }

[package]
name = "selachi"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
agents_svc = { version = "0.0.1", path = "../agents_svc" }
anyhow.workspace = true
env_logger.workspace = true
futures.workspace = true
git_svc = { version = "0.1.0", path = "../git_svc" }
gpui.workspace = true
log.workspace = true
panel_api = { version = "0.1.0", path = "../panel_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
store = { version = "0.0.1", path = "../store" }
term_core = { version = "0.1.0", path = "../term_core", features = ["block-events"] }
theme = { version = "0.1.0", path = "../theme" }
toml = "0.8"
ui_layout = { version = "0.1.0", path = "../ui_layout" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

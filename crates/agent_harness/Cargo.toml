[package]
name = "agent_harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Selachi agent harness (PLAN section 20): delegate work to other coding agents from a CLI (`selachi-agent`) with isolation, limits, approvals and cost. UI-agnostic, Windows only."

[lints]
workspace = true

[[bin]]
name = "selachi-agent"
path = "src/bin/selachi-agent.rs"

[dependencies]
agents_driver = { version = "0.1.0", path = "../agents_driver" }
agents_svc = { path = "../agents_svc" }
chat_core = { version = "0.1.0", path = "../chat_core" }
git_svc = { version = "0.1.0", path = "../git_svc" }
store = { path = "../store" }
futures.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log.workspace = true
env_logger.workspace = true
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "0.8"

[target.'cfg(windows)'.dependencies]
proc_svc = { path = "../proc_svc" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

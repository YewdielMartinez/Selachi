[package]
name = "term_core"
version = "0.1.0"
edition = "2024"

[features]
# Adds `SessionEvent::BlockStarted` / `BlockFinished`. Off by default: enabling it adds enum
# variants, so crates matching `SessionEvent` exhaustively must add the arms first.
block-events = []

[lints]
workspace = true

[dependencies]
alacritty_terminal.workspace = true
futures.workspace = true
log.workspace = true
polling = "3.8"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
piper = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
proc_svc = { path = "../proc_svc" }

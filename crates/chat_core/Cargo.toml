[package]
name = "chat_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Selachi chat mode model (PLAN section 14): persisted threads, AgentEvent normalization, lifecycle, worktrees, checkpoints and cost. UI-agnostic (no gpui, no tokio)."

[lints]
workspace = true

[dependencies]
agents_driver = { version = "0.1.0", path = "../agents_driver" }
agents_svc = { path = "../agents_svc" }
git_svc = { version = "0.1.0", path = "../git_svc" }
store = { path = "../store" }
futures.workspace = true
log.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[package]
name = "ui_usage"
version = "0.1.0"
edition = "2024"
description = "Selachi usage panel (PLAN sections 6 and 12): tokens per agent, official 5 h / 7 day limits with dither meters, limit forecast, cost per branch and a 14-day pixel chart. Read-only over agents_svc; refreshes only when the host reports a scan"

[lints]
workspace = true

[dependencies]
agents_svc = { version = "0.0.1", path = "../agents_svc" }
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui.workspace = true
log.workspace = true
panel_api = { version = "0.1.0", path = "../panel_api" }
theme = { version = "0.1.0", path = "../theme" }
ui_kit = { version = "0.1.0", path = "../ui_kit" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

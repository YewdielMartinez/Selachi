[package]
name = "ui_kit"
version = "0.1.0"
edition = "2024"
description = "Selachi UI kit: theme-driven gpui components (pills, buttons, meters, popovers, lists, wireframes) and the embedded icon/logo assets"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
theme = { version = "0.1.0", path = "../theme" }

[features]
# `ui_kit::testing` for the crates that test their views (enable it in their dev-dependencies).
test-support = ["gpui/test-support"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
